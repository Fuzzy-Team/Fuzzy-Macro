<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Fuzzy Macro</title>
  <link rel="stylesheet" href="styles/style.css" />
  <script>
    // Config > App Settings > Appearance > Top Navigation opens the page with ?nav=top
    const topNav = new URLSearchParams(location.search).get("nav") === "top";
    if (topNav) document.write('<link rel="stylesheet" href="styles/top-nav.css" />');
  </script>
  <link rel="shortcut icon" type="image/x-icon" href="assets/general/icon.png" />
  <script type="text/javascript" src="./scripts/jquery.js"></script>
  <script type="text/javascript" src="./scripts/ui-builder.js"></script>
  <script type="text/javascript" src="./scripts/emojis.js"></script>
  <script type="text/javascript" src="./scripts/memory-match-rewards.js"></script>
  <script type="text/javascript" src="./scripts/report-buffs.js"></script>
  <script type="text/javascript" src="./scripts/themes.js"></script>
</head>

<body>
  <div class="app-container">
    <header class="app-nav">
      <div class="app-title">Fuzzy Macro <span id="version" class="app-version"></span></div>
      <nav id="tabs-placeholder" aria-label="Main">
        <!-- Tabs loaded via JS -->
      </nav>
      <div class="run-controls">
        <select id="macro_mode" aria-label="Macro Mode">
          <option value="normal">Normal Mode</option>
          <option value="alt">Alt Mode</option>
          <option value="field">Field Mode</option>
          <option value="quest">Quest Mode</option>
          <option value="bug">Bug Run Mode</option>
          <option value="boost">Boost Mode</option>
          <option value="resources">Resources Mode</option>
          <option value="vic">Vic Hop Mode</option>
        </select>
        <button class="purple-button d-none" id="stop-btn">Stop [F3]</button>
        <button class="purple-button" id="start-btn">Start [F1]</button>
      </div>
      <!-- Sidebar: version and updates at the bottom, start/stop and mode on the Home tab.
           Top bar: version by the title, start/stop and mode in the bar, update button in Config. -->
      <div class="update-slot">
        <button id="update-btn" class="purple-button" onclick="startUpdate()">Check for Updates</button>
      </div>
    </header>
    <div id="update-progress" class="update-progress d-none" aria-live="polite">
      <div class="update-progress-row">
        <span id="update-progress-label">Preparing update</span>
        <span id="update-progress-percent">0%</span>
      </div>
      <div class="update-progress-track">
        <div id="update-progress-bar" class="update-progress-bar"></div>
      </div>
    </div>
    <script>
      if (topNav) {
        document.querySelector(".update-slot").remove();
      } else {
        const slot = document.querySelector(".update-slot");
        slot.prepend(document.getElementById("version"));
        slot.append(document.getElementById("update-progress"));
        document.querySelector(".run-controls").remove();
      }
    </script>

    <main class="main-content-container">
      <div id="home-placeholder" class="content" style="display: flex;"></div>
      <div id="gather-placeholder" class="content"></div>
      <div id="collect-placeholder" class="content"></div>
      <div id="config-placeholder" class="content"></div>
      <div id="kill-placeholder" class="content"></div>
      <div id="planters-placeholder" class="content"></div>
      <div id="boost-placeholder" class="content"></div>
      <div id="quests-placeholder" class="content"></div>
      <div id="tools-placeholder" class="content"></div>
    </main>
  </div>

  <script type="text/javascript" src="/eel.js"></script>
  <script src="./scripts/script.js"></script>
  <script src="./scripts/tabs/tab.js"></script>
  <script src="./scripts/tabs/home.js"></script>
  <script src="./scripts/tabs/gather.js"></script>
  <script src="./scripts/tabs/config.js"></script>
  <script src="./scripts/tabs/collect.js"></script>
  <script src="./scripts/tabs/kill.js"></script>
  <script src="./scripts/tabs/planters.js"></script>
  <script src="./scripts/tabs/boost.js"></script>
  <script src="./scripts/tabs/quests.js"></script>
  <script src="./scripts/tabs/tools.js"></script>
  <script>
    // Fetch version from version.txt and optionally append commit hash
    (async () => {
      try {
        const vRes = await fetch('./version.txt');
        const version = (await vRes.text()).trim();
        let display = 'v' + (version || '?');
        // try to fetch optional commit marker written by updater
        try {
          const cRes = await fetch('./updated_commit.txt');
          if (cRes.ok) {
            const commit = (await cRes.text()).trim();
            if (commit) display += ' - ' + commit;
          }
        } catch (e) {
          // ignore if marker missing or fetch fails
        }
        document.getElementById('version').textContent = display;
      } catch (e) {
        document.getElementById('version').textContent = 'v?';
      }
    })();
  </script>
</body>

</html>
