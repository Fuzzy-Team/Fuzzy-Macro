<div class="main-content-container">
  <div class="sub-nav-bar">
    <div id="quests-quests" class="quests-tab-item">Quests</div>
    <div id="quests-settings" class="quests-tab-item">Settings</div>
  </div>
  <div id="quests-settings-tab" class="standard-container sub-tab-panel">
    <script>
      const questsSettingsParent = document.getElementById("quests-settings-tab");
      const questReturnOptions = ["No Override", "💀 Reset", "👟 Walk", "🔄 Rejoin", "🌱 Whirligig"];

      buildStandardContainer(questsSettingsParent, "Quest Scheduling", "Decide which quest objective the macro works on next", [
        {
          id: "quest_scheduling",
          title: "Scheduling Mode",
          desc: "Quest Giver Priority follows your quest order. Optimize Quest Completion finishes shared field work first.",
          type: {
            name: "dropdown",
            data: ["Quest Giver Priority", "Optimize Quest Completion"],
            triggerFunction: saveProfileTriggerFunction,
            length: 16,
          },
        },
      ]);

      buildStandardContainer(questsSettingsParent, "Objective Gather Settings", "Each objective uses the same mapping for every quest giver. A field named by the quest always wins.", [
        { id: "quest_mapping_objective", title: "Objective", desc: "Shared across all quest givers",
          type: { name: "dropdown", data: [], triggerFunction: "showQuestObjectiveSettings(getDropdownValue(this))", length: 22 } },
        { id: "quest_mapping_field", title: "Field", desc: "Auto chooses a suitable field",
          type: { name: "dropdown", data: [{ label: "Auto", value: "auto" }], triggerFunction: saveProfileTriggerFunction, length: 12 } },
        { id: "quest_mapping_pattern", title: "Pattern", desc: "Auto uses field settings or BloomsAI",
          type: { name: "dropdown", data: [{ label: "Auto", value: "auto" }], triggerFunction: saveProfileTriggerFunction, length: 12 } },
        { id: "quest_mapping_mins", title: "Gather Until Mins", desc: "0 uses the field or petal time",
          type: { name: "textbox", inputType: "float", inputLimit: 4, triggerFunction: saveProfileTriggerFunction, length: 12 } },
        { id: "quest_mapping_backpack", title: "Backpack%", desc: "Auto uses the field limit",
          type: { name: "dropdown", data: [{ label: "Auto", value: "auto" }, ...Array.from({length: 20}, (_, index) => ({label: `${(index + 1) * 5}%`, value: String((index + 1) * 5)}))], triggerFunction: saveProfileTriggerFunction, length: 12 } },
        { id: "quest_mapping_return", title: "Return To Hive", desc: "How to return after gathering",
          type: { name: "dropdown", data: questReturnOptions, triggerFunction: saveProfileTriggerFunction, length: 12 } },
      ]);

      buildStandardContainer(questsSettingsParent, "Goo Settings", "Decide how the macro wants to handle gathering goo", [
        {
          id: "quest_use_gumdrops",
          title: "Use Gumdrops",
          desc: "Use gumdrops when gathering for goo quests (uses the Gumdrop Slot in Config)",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
      ]);

      buildStandardContainer(questsSettingsParent, "Live Quest Progress", "Watch the open quest menu while gathering for quests.", [
        {
          id: "quest_progress_watch",
          title: "Keep Quest Menu Open",
          desc: "Stop gathering early once the objective is complete. Time and backpack limits still apply.",
          type: {
            name: "checkbox",
            triggerFunction: `${saveProfileTriggerFunction}; updateQuestProgressFields()`,
          },
        },
        {
          id: "quest_progress_check_mode",
          title: "Check Progress",
          desc: "Checks happen between pattern loops, so a long pattern finishes first",
          type: {
            name: "dropdown",
            data: [{ label: "On an Interval", value: "interval" }, { label: "Every Pattern Loop", value: "every iteration" }],
            triggerFunction: `${saveProfileTriggerFunction}; updateQuestProgressFields()`,
            length: 12,
          },
        },
        {
          id: "quest_progress_check_seconds",
          title: "Check Interval (secs)",
          desc: "Seconds between quest menu checks",
          type: {
            name: "textbox",
            inputType: "float",
            inputLimit: 4,
            triggerFunction: saveProfileTriggerFunction,
            length: 12,
          },
        },
      ]);

      buildStandardContainer(questsSettingsParent, "Quest Gather Interrupt", "Choose which quest givers may interrupt gathering when a required mob respawns.", [
        ...[
          ["polar_bear", "Polar Bear"],
          ["brown_bear", "Brown Bear"],
          ["black_bear", "Black Bear"],
          ["honey_bee", "Honey Bee"],
          ["bucko_bee", "Bucko Bee"],
          ["riley_bee", "Riley Bee"],
        ].map(([key, label]) => ({
          id: `${key}_quest_gather_interrupt`,
          title: label,
          desc: `Interrupt gathering for mobs required by ${label}'s active quest`,
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        })),
      ]);

      buildStandardContainer(questsSettingsParent, "Petal Gather", "Petal objectives use BloomsAI by default. Individual objective settings take priority.", [
        {
          id: "petal_quest_gather_mins",
          title: "Gather Until Mins",
          desc: "Gather time for petal objectives. Set to 0 to use the field time.",
          type: {
            name: "textbox",
            inputType: "float",
            inputLimit: 4,
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "petal_quest_gather_return",
          title: "Return To Hive",
          desc: "Return behavior for petal objectives",
          type: {
            name: "dropdown",
            data: questReturnOptions,
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "ignore_petal_quests",
          title: "Ignore Petal Quests",
          desc: "Skip known petal quest titles instead of gathering bloom petals",
          type: {
            name: "checkbox",
            triggerFunction: saveGeneralTriggerFunction,
          },
        },
      ]);
    </script>
  </div>

  <div id="quests-quests-tab" class="standard-container sub-tab-panel active">
    <script>
      const questsQuestsParent = document.getElementById("quests-quests-tab");
      const questsContainer = document.createElement("div");
      questsQuestsParent.appendChild(questsContainer);

      buildStandardContainer(questsContainer, "Quests", "", [
        {
          id: "polar_bear_quest",
          title: "Polar Bear",
          desc: "Complete Polar Bear's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "brown_bear_quest",
          title: "Brown Bear",
          desc: "Complete Brown Bear's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "black_bear_quest",
          title: "Black Bear (Repeatable Quests Only)",
          desc: "Complete Black Bear's Repeatable Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "honey_bee_quest",
          title: "Honey Bee",
          desc: "Complete Honey Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "bucko_bee_quest",
          title: "Bucko Bee",
          desc: "Complete Bucko Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "riley_bee_quest",
          title: "Riley Bee",
          desc: "Complete Riley Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
      ]);
    </script>
  </div>
</div>
