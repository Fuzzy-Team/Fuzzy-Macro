<div class="main-content-container">
  <div class="sub-nav-bar">
    <div id="quests-quests" class="quests-tab-item">Quests</div>
    <div id="quests-settings" class="quests-tab-item">Settings</div>
  </div>
  <div id="quests-settings-tab" class="standard-container sub-tab-panel">
    <script>
      const questsSettingsParent = document.getElementById("quests-settings-tab");
      questsSettingsParent.innerHTML += `<div class="poppins-medium standard-container quest-overrides">
        <h2>Quest scheduling</h2><p>Choose how the macro shares work between quest givers.</p>
        <label class="quest-setting-label" for="quest_scheduling">Scheduling mode
          <select id="quest_scheduling" class="textbox quest-native-select" onchange="saveSetting(this, 'profile')">
            <option value="quest giver priority">Quest giver priority</option>
            <option value="optimize quest completion">Optimize quest completion</option>
          </select>
        </label><p>Follow giver priority, or finish shared field work and favor fields that advance more objectives.</p>
      </div>`;

      (function buildQuestOverrides(parent) {
        const givers = ["polar bear", "brown bear", "black bear", "honey bee", "bucko bee", "riley bee"];
        const fields = Object.keys(fieldEmojis).filter(field => field !== "hive_hub").map(field => field.replaceAll("_", " "));
        const colors = {
          red: ["mushroom", "strawberry", "rose", "pepper"],
          blue: ["blue flower", "bamboo", "pine tree", "stump"],
          white: fields.filter(field => field !== "mountain top"),
          any: fields,
        };
        function select(id, label, options) {
          return `<label class="quest-setting-label" for="${id}">${label}<select id="${id}" class="textbox quest-native-select" onchange="saveSetting(this, 'profile')">${options.map(([value, text]) => `<option value="${value}">${text}</option>`).join("")}</select></label>`;
        }
        let html = `<div class="poppins-medium standard-container quest-overrides"><h2>Gather overrides</h2>
          <p>Use field settings for pollen and tokens, add gumdrops for goo when enabled, and use BloomsAI for petals. Giver overrides take priority, including the pattern for petal objectives.</p>
          <label class="quest-setting-label" for="quest-settings-giver">Quest giver<select id="quest-settings-giver" class="textbox quest-native-select" onchange="showQuestGiverSettings(this.value)">${givers.map(giver => `<option value="${giver.replaceAll(' ', '_')}">${toTitleCase(giver)}</option>`).join("")}</select></label>`;
        givers.forEach((giver, index) => {
          const key = giver.replaceAll(" ", "_");
          html += `<section class="quest-giver-settings" id="${key}-quest-settings" ${index ? 'hidden' : ''} aria-label="${toTitleCase(giver)} gather overrides"><div class="quest-settings-grid">`;
          html += select(`${key}_quest_gather_pattern`, "Pattern", [["auto", "Auto"]]);
          html += `<label class="quest-setting-label" for="${key}_quest_gather_mins">Gather minutes, 0 uses default<input id="${key}_quest_gather_mins" class="textbox" type="text" inputmode="decimal" data-input-type="float" autocomplete="off" onchange="saveSetting(this, 'profile')"></label>`;
          html += select(`${key}_quest_gather_backpack`, "Backpack limit", [["auto", "Auto"], ...Array.from({length: 100}, (_, index) => [String(index + 1), `${index + 1}%`])]);
          html += select(`${key}_quest_gather_return`, "Return to hive", [["no override", "No Override"], ["reset", "Reset"], ["walk", "Walk"], ["rejoin", "Rejoin"], ["whirligig", "Whirligig"]]);
          html += `</div><h3>Preferred fields</h3><p>Auto shares a suitable quest field, then uses an enabled Gather field or the default. A quest's required field always wins.</p><div class="quest-settings-grid">`;
          for (const [color, options] of Object.entries(colors)) {
            html += select(`${key}_quest_field_${color}`, color === "any" ? "Unrestricted objectives" : `${toTitleCase(color)} objectives`, [["auto", "Auto"], ...options.map(field => [field, toTitleCase(field)])]);
          }
          html += `</div></section>`;
        });
        parent.innerHTML += html + `</div>`;
      })(questsSettingsParent);

      buildStandardContainer(questsSettingsParent, "Goo Settings", "Decide how the macro wants to handle gathering goo", [
        {
          id: "quest_use_gumdrops",
          title: "Use Gumdrops",
          desc: "Use gumdrops when gathering for goo quests (uses the Gumdrop Slot in Config)",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
      ]);

      buildStandardContainer(questsSettingsParent, "Live Quest Progress", "Watch the open quest menu while gathering for quests.", [
        {
          id: "quest_progress_watch",
          title: "Keep Quest Menu Open",
          desc: "Check the active objective between pattern iterations and stop early when it completes. Time and backpack limits still apply.",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
      ]);

      questsSettingsParent.innerHTML += `<div class="poppins-medium standard-container quest-overrides">
        <h2>Progress checks</h2><p>Used while Keep Quest Menu Open is enabled. Long patterns finish before checking.</p>
        <div class="quest-settings-grid">
          <label class="quest-setting-label" for="quest_progress_check_mode">Check progress
            <select id="quest_progress_check_mode" class="textbox quest-native-select" onchange="saveSetting(this, 'profile')">
              <option value="interval">Time interval</option><option value="every iteration">Every iteration</option>
            </select>
          </label>
          <label class="quest-setting-label" for="quest_progress_check_seconds">Check interval, seconds
            <input id="quest_progress_check_seconds" class="textbox" type="text" inputmode="decimal" data-input-type="float" autocomplete="off" onchange="saveSetting(this, 'profile')">
          </label>
        </div><p>Default 10 seconds. The interval is only used for time interval checks.</p>
      </div>`;

      buildStandardContainer(questsSettingsParent, "Quest Gather Interrupt", "Choose which quest givers may interrupt gathering when a required mob respawns.", [
        ...[
          ["polar_bear", "Polar Bear"],
          ["brown_bear", "Brown Bear"],
          ["black_bear", "Black Bear"],
          ["honey_bee", "Honey Bee"],
          ["bucko_bee", "Bucko Bee"],
          ["riley_bee", "Riley Bee"],
        ].map(([key, label]) => ({
          id: `${key}_quest_gather_interrupt`,
          title: label,
          desc: `Interrupt gathering for mobs required by ${label}'s active quest`,
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        })),
      ]);

      buildStandardContainer(questsSettingsParent, "Petal Gather", "Petal defaults apply before explicit quest giver overrides.", [
        {
          id: "petal_quest_gather_mins",
          title: "Gather Until Mins",
          desc: "Default time for petal objectives. Set to 0 to use the field time. A giver override takes priority.",
          type: {
            name: "textbox",
            inputType: "float",
            inputLimit: 4,
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "petal_quest_gather_return",
          title: "Return To Hive",
          desc: "Default return method for petal objectives. A giver override takes priority.",
          type: {
            name: "dropdown",
            data: ["No Override", "💀 Reset", "👟 Walk", "🔄 Rejoin", "🌱 Whirligig"],
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "ignore_petal_quests",
          title: "Ignore Petal Quests",
          desc: "Skip known petal quest titles instead of gathering bloom petals",
          type: {
            name: "checkbox",
            triggerFunction: saveGeneralTriggerFunction,
          },
        },
      ]);
    </script>
  </div>

  <div id="quests-quests-tab" class="standard-container sub-tab-panel active">
    <script>
      const questsQuestsParent = document.getElementById("quests-quests-tab");
      const questsContainer = document.createElement("div");
      questsQuestsParent.appendChild(questsContainer);

      buildStandardContainer(questsContainer, "Quests", "", [
        {
          id: "polar_bear_quest",
          title: "Polar Bear",
          desc: "Complete Polar Bear's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "brown_bear_quest",
          title: "Brown Bear",
          desc: "Complete Brown Bear's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "black_bear_quest",
          title: "Black Bear (Repeatable Quests Only)",
          desc: "Complete Black Bear's Repeatable Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "honey_bee_quest",
          title: "Honey Bee",
          desc: "Complete Honey Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "bucko_bee_quest",
          title: "Bucko Bee",
          desc: "Complete Bucko Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "riley_bee_quest",
          title: "Riley Bee",
          desc: "Complete Riley Bee's Quests",
          type: {
            name: "checkbox",
            triggerFunction: saveProfileTriggerFunction,
          },
        },
      ]);
    </script>
  </div>
</div>
