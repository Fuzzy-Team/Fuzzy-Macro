            triggerFunction: saveProfileTriggerFunction,
          },
        },
        {
          id: "blender-reset",
          title: "Reset Blender Timers",
          desc: "Resets the macro's tracking data on blender items",
          type: {
            name: "button",
            text: "Reset",
            triggerFunction: "clearBlenderData(this)",
          },
        },
        {
          title: "Craft Queue",
          desc: "Crafts each slot in order, then starts over at slot 1. Empty slots and slots with 0 repeats are skipped.",
          type: { name: "separator" },
        },
      ]);

      // one number box with - / + buttons and an on/off chip that overrides it
      function blenderCounter(id, flagId, label, flagText, flagLabel, flagTitle, min, length) {
        const save = "saveSetting(this, 'profile')";
        return `
          <div class="blender-field" data-label="${label}">
            <input type="checkbox" class="blender-flag" id="${flagId}" aria-label="${flagLabel}" onchange="${save}">
            <div class="blender-stepper">
              <button type="button" class="blender-step" aria-label="Decrease ${label.toLowerCase()}" onclick="stepBlenderInput('${id}', -1, ${min})">−</button>
              ${buildInput(id, { name: "textbox", triggerFunction: save, inputType: "int", length })}
              <button type="button" class="blender-step" aria-label="Increase ${label.toLowerCase()}" onclick="stepBlenderInput('${id}', 1, ${min})">+</button>
            </div>
            <label class="blender-chip" for="${flagId}" title="${flagTitle}">${flagText}</label>
          </div>`;
      }

      // one queue card; the number is its drag handle. collect.js builds as many as the profile has.
      const blenderItemsArray = toImgArray(blenderIcons);
      function blenderSlotHTML(i) {
        return `
          <div class="blender-slot" data-slot="${i}">
            <button type="button" class="blender-slot-num" draggable="true" title="Drag to reorder, or press Up or Down">${i}</button>
            ${buildInput(`blender_item_${i}`, {
              name: "dropdown",
              data: blenderItemsArray,
              triggerFunction: "saveSetting(this, 'profile')",
            })}
            ${blenderCounter(`blender_quantity_${i}`, `blender_quantity_max_${i}`, "Amount", "Max", "Craft the max quantity", "Craft the max quantity", 1, 4)}
            ${blenderCounter(`blender_repeat_${i}`, `blender_repeat_inf_${i}`, "Repeat", "∞", "Repeat forever", "Repeat forever", 0, 4)}
            <button type="button" class="blender-slot-remove" title="Remove this slot" onclick="removeBlenderSlot(this)">×</button>
          </div>`;
      }
      document.getElementById("blender").parentElement.insertAdjacentHTML("beforeend", `
        <div class="blender-queue-head" aria-hidden="true"><span></span><span>Item</span><span>Amount</span><span>Repeat</span><span></span></div>
        <div class="blender-queue"></div>
        <button type="button" class="blender-add" onclick="addBlenderSlot()">+ Add Slot</button>`);
    </script>
  </div>
